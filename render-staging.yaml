# Render.com STAGING service configuration for Pinglo Frontend
# Deploy this separately on Render dashboard pointing to the 'staging' branch

services:
  - type: web
    name: pinglo-frontend-staging
    env: static
    branch: staging
    plan: free
    buildCommand: "./build.sh"
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: VITE_API_URL
        value: https://pinglo-backend-staging.onrender.com/api
      - key: VITE_SOCKET_URL
        value: https://pinglo-backend-staging.onrender.com
      - key: NODE_ENV
        value: staging
