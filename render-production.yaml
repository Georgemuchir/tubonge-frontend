# Render.com PRODUCTION service configuration for Pinglo Frontend
# This file is automatically detected by Render for the 'main' branch

services:
  - type: web
    name: pinglo-frontend
    env: static
    branch: main
    plan: free
    buildCommand: "./build.sh"
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: VITE_API_URL
        value: https://pinglo-backend.onrender.com/api
      - key: VITE_SOCKET_URL
        value: https://pinglo-backend.onrender.com
      - key: NODE_ENV
        value: production
